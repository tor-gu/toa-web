<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament of Albums</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/atom+xml" title="Tournament of Albums — Match Results" href="https://toa-api.tor-gu.com/feed">
  <!-- Root-absolute, not document-relative: this document is also served from
       /album/<id> and /match/<id>, where "theme.css" would resolve to /album/theme.css. -->
  <link rel="stylesheet" href="/theme.css">
  <!-- Blocking, and in this order: api.js reads window.TOA_CONFIG, and app.js at
       the end of <body> reads the window.TOA_API_BASE_URL that api.js sets. -->
  <script src="/config.js"></script>
  <script src="/api.js"></script>
  <script src="/theme.js" defer></script>
  <!-- Root-absolute for the same reason as /theme.css above. Linked after it,
       so these page-specific rules win the cascade. -->
  <link rel="stylesheet" href="/index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Star artwork for the Rating column, defined once: each row's five stars
       are <use> references, so ~500 rows don't repeat the path data. Every colour
       is a custom property set on .stars in index.css, so the look is a CSS-only
       change. Filled and empty outlines are separate properties: the half star
       draws its filled side's outline as an open polyline (no stroke down the
       cut), so the two halves can be outlined differently. Its left half is its
       own polygon rather than a clipPath, whose id resolution inside <use> is
       unreliable. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star-full" viewBox="0 0 24 24">
      <polygon style="fill:var(--star-fill);stroke:var(--star-stroke);stroke-width:var(--star-stroke-width);stroke-linejoin:round;stroke-linecap:round" points="12,1.9 14.7,9.18 22.46,9.5 16.37,14.32 18.47,21.8 12,17.5 5.53,21.8 7.63,14.32 1.54,9.5 9.3,9.18"/>
    </symbol>
    <symbol id="star-half" viewBox="0 0 24 24">
      <polygon style="fill:var(--star-empty);stroke:var(--star-empty-stroke);stroke-width:var(--star-stroke-width);stroke-linejoin:round;stroke-linecap:round" points="12,1.9 14.7,9.18 22.46,9.5 16.37,14.32 18.47,21.8 12,17.5 5.53,21.8 7.63,14.32 1.54,9.5 9.3,9.18"/>
      <polygon style="fill:var(--star-fill)" points="12,1.9 9.3,9.18 1.54,9.5 7.63,14.32 5.53,21.8 12,17.5"/>
      <polyline style="fill:none;stroke:var(--star-stroke);stroke-width:var(--star-stroke-width);stroke-linejoin:round;stroke-linecap:round" points="12,1.9 9.3,9.18 1.54,9.5 7.63,14.32 5.53,21.8 12,17.5"/>
    </symbol>
    <symbol id="star-empty" viewBox="0 0 24 24">
      <polygon style="fill:var(--star-empty);stroke:var(--star-empty-stroke);stroke-width:var(--star-stroke-width);stroke-linejoin:round;stroke-linecap:round" points="12,1.9 14.7,9.18 22.46,9.5 16.37,14.32 18.47,21.8 12,17.5 5.53,21.8 7.63,14.32 1.54,9.5 9.3,9.18"/>
    </symbol>
  </svg>
  <div class="page-header">
    <div class="header-deco"></div>
    <h1>Tournament of Albums</h1>
    <div id="date"></div>
  </div>

  <div id="view-landing">
    <div class="page-layout">
      <aside id="recent-matches-panel" class="panel">
        <div class="section-label">Recent Matches</div>
        <p id="recent-matches-status"></p>
        <div id="recent-matches-list"></div>
      </aside>

      <div class="page-main">
        <div class="section-label">Current Rankings</div>
        <div id="search-wrap">
          <input type="text" id="search" placeholder="Search artist or album…" aria-label="Search artist or album">
        </div>
        <div id="content"></div>
      </div>
    </div>
  </div>

  <div id="view-album" style="display:none">
    <div id="album-heading">
      <div id="album-artist"></div>
      <!-- The rating sits beside the <h2>, not inside it, so the heading's
           accessible name stays the album title alone. -->
      <div id="album-title-row">
        <h2 id="album-title"></h2>
        <span id="album-rating"></span>
      </div>
    </div>
    <div id="history-panel" class="panel">
      <div id="history-panes">
        <div id="score-pane">
          <h2>Score History</h2>
          <div id="compare-wrap">
            <input type="text" id="compare-input" placeholder="Add album to chart…" aria-label="Add album to chart" autocomplete="off">
            <ul id="compare-dropdown"></ul>
          </div>
          <div id="history-chips"></div>
          <p id="history-status"></p>
          <div id="history-canvas-wrap"><canvas id="history-canvas"></canvas><div id="chart-tooltip"></div></div>
        </div>
        <div id="match-pane">
          <h2>Match History</h2>
          <p id="match-status"></p>
          <div id="match-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="view-match" style="display:none">
    <div id="match-heading">
      <div id="match-kicker">Match Results</div>
      <h2 id="match-title"></h2>
      <div id="match-subtitle"></div>
    </div>
    <div id="match-panel" class="panel">
      <p id="match-view-status"></p>
      <div id="match-table-wrap"></div>
    </div>
    <!-- Hidden until there is a ranking to chart: an empty .panel still draws
         its border and shadow. Chart.js is already loaded above for the album
         view, so this costs no new script. -->
    <div id="match-chart-panel" class="panel" style="display:none">
      <h2>Score History</h2>
      <p id="match-chart-status"></p>
      <div id="match-chart-wrap"><canvas id="match-chart-canvas"></canvas></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
